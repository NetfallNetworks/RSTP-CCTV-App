[versions]
agp = "9.0.1"
coreKtx = "1.10.1"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
appcompat = "1.6.1"
material = "1.10.0"
constraintlayout = "2.1.4"
recyclerview = "1.3.2"
# rtspServer pins rootEncoder transitively -- bump both together.
# 1.4.2 / 2.8.0 require compileSdk 37, which AGP 9.0.1 does not support.
#
# Both currently point at NetfallNetworks forks, not upstream pedroSG94, pinned to
# specific commits rather than tags (JitPack builds any public commit SHA directly):
# - RootEncoder (branch fix/rtsp-stapa-start-codes off netfall/2.7.2, i.e. upstream 2.7.2
#   plus our patches) adds prepareVideoCropped(), used by CctvServerService to stream
#   this camera upright at its own 4:3 landscape shape (plain prepareVideo() squashes it
#   into a transposed portrait frame), turns video stabilization off unless asked for
#   (this HAL defaults it on, cropping the field of view to 1333x1000 of the 1600x1200
#   sensor), and strips SPS/PPS start codes before STAP-A packing (without this, every
#   keyframe in a recording of the RTSP stream carries an empty NAL unit ahead of
#   SPS/PPS, and the recording fails to decode -- RootEncoder#2).
# - RTSP-Server (branch fix/pin-rootencoder-stapa off netfall/1.4.1) just repoints its
#   own RootEncoder dependency at the fork above (no source changes -- RtspServerCamera2
#   only extends Camera2Base).
# rootEncoder must equal the SHA rtspServer pins, or Gradle picks between the two
# arbitrarily. 165122d is RootEncoder's fix/rtsp-stapa-start-codes head (on top of the
# already-merged eb97684 decouple-camera-capture-size fix on netfall/2.7.2); it is what
# RTSP-Server's fix/pin-rootencoder-stapa (00f8046) pins.
rootEncoder = "165122d05c219ceddec466869ab73a2b0038eeff"
rtspServer = "00f8046f9af9bca2fbbb158cb87cfb48125afeca"
nanohttpd = "2.3.1"
# tensorflow-lite-task-vision was frozen at 0.4.4 (Jul 2023) and its
# libtask_vision_jni.so has 4 KB LOAD alignment, which fails Android 16 KB
# page-size checks. MediaPipe Tasks is its maintained successor and ships
# 16 KB-aligned natives.
mediapipeTasksVision = "1.0.0"
# Gemini Nano via AICore. Pre-release, and absent on most hardware -- every
# call site must degrade silently when it is unavailable.
mlkitGenaiImageDescription = "1.0.0-beta1"
json = "20250517"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }
rootencoder-library = { group = "com.github.NetfallNetworks.RootEncoder", name = "library", version.ref = "rootEncoder" }
rtsp-server = { group = "com.github.NetfallNetworks", name = "RTSP-Server", version.ref = "rtspServer" }
nanohttpd = { group = "org.nanohttpd", name = "nanohttpd", version.ref = "nanohttpd" }
json = { group = "org.json", name = "json", version.ref = "json" }
mediapipe-tasks-vision = { group = "com.google.mediapipe", name = "tasks-vision", version.ref = "mediapipeTasksVision" }
mlkit-genai-image-description = { group = "com.google.mlkit", name = "genai-image-description", version.ref = "mlkitGenaiImageDescription" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }

